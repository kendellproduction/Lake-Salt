<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Quote — Lake Salt Bartending</title>
  <meta name="description" content="Your custom bar service proposal from Lake Salt." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:#0C1526;--navy-lt:#1A2A42;--champagne:#C9A96E;--champagne-lt:#E2C99A;
      --champagne-pale:#F5EDD8;--ivory:#FAF7F2;--white:#FFFFFF;--charcoal:#2C3E50;--cream:#EDE8DF;
      --font-display:'Cormorant Garamond',Georgia,serif;
      --font-body:'Inter',system-ui,sans-serif;
      --shadow:0 4px 16px rgba(0,0,0,0.08),0 2px 6px rgba(0,0,0,0.04);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);background:var(--ivory);color:var(--charcoal);line-height:1.6;-webkit-font-smoothing:antialiased}

    .hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-lt) 60%,#1e3a5f 100%);color:var(--white);padding:3rem 2rem;text-align:center;position:relative;overflow:hidden}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 40%,rgba(201,169,110,.12) 0%,transparent 65%);pointer-events:none}
    .hero-logo{font-family:var(--font-display);font-size:1.75rem;font-weight:300;letter-spacing:.08em}
    .hero-logo span{color:var(--champagne)}
    .hero-eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--champagne);margin-top:1.5rem;margin-bottom:.5rem}
    h1.proposal-name{font-family:var(--font-display);font-size:clamp(2rem,5vw,3rem);font-weight:300;line-height:1.1;max-width:640px;margin:0 auto}
    h1.proposal-name em{color:var(--champagne);font-style:italic}

    .container{max-width:780px;margin:0 auto;padding:3rem 1.5rem 5rem}
    .intro{font-size:1.05rem;line-height:1.8;margin-bottom:2.5rem;color:var(--charcoal)}

    .panel{background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:1.75rem;margin-bottom:1.25rem;border:1px solid rgba(12,21,38,.06)}
    .panel-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--champagne);margin-bottom:1rem}

    .line{display:flex;justify-content:space-between;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--cream);font-size:.95rem;gap:1rem}
    .line:last-child{border-bottom:none}
    .line-label{color:var(--charcoal)}
    .line-amt{color:var(--charcoal);font-weight:600;white-space:nowrap}
    .line-sub{font-size:.78rem;color:rgba(44,62,80,.6);margin-top:2px}

    .totals .line{font-size:1rem}
    .totals .grand{padding-top:1rem;border-top:2px solid var(--navy);margin-top:.5rem}
    .totals .grand .line-label{font-family:var(--font-display);font-size:1.5rem;color:var(--navy)}
    .totals .grand .line-amt{font-family:var(--font-display);font-size:1.75rem;color:var(--champagne);font-weight:600}
    .totals .deposit{font-size:.88rem;color:rgba(44,62,80,.7);margin-top:.5rem}

    .accept-panel{background:linear-gradient(135deg,#C9A96E 0%,#E2C99A 100%);padding:2.25rem 1.75rem;text-align:center;border-radius:14px;margin-top:1.5rem}
    .accept-panel h2{font-family:var(--font-display);font-size:clamp(1.5rem,3vw,2rem);font-weight:300;color:var(--navy);margin-bottom:.5rem}
    .accept-panel h2 em{font-style:italic}
    .accept-panel p{font-size:.95rem;color:rgba(12,21,38,.75);margin-bottom:1.5rem;max-width:480px;margin-left:auto;margin-right:auto}
    .accept-form input[type=text]{width:100%;max-width:340px;padding:.85rem 1rem;border:1.5px solid rgba(12,21,38,.2);border-radius:8px;font-size:1rem;font-family:var(--font-body);background:rgba(255,255,255,.7);margin-bottom:.85rem;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.2rem}
    .accept-form input[type=text]:focus{outline:none;border-color:var(--navy);background:var(--white)}
    .accept-btn{display:inline-block;background:var(--navy);color:var(--white);padding:1rem 2.5rem;border-radius:3rem;text-decoration:none;font-size:.92rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:none;cursor:pointer;transition:all .25s;font-family:var(--font-body)}
    .accept-btn:hover:not(:disabled){background:var(--navy-lt);transform:translateY(-1px);box-shadow:0 8px 20px rgba(12,21,38,.25)}
    .accept-btn:disabled{opacity:.5;cursor:not-allowed}
    .accept-fineprint{font-size:.75rem;color:rgba(12,21,38,.55);margin-top:1rem;line-height:1.5}

    .accepted-banner{background:#22c55e;color:white;padding:1.25rem 1.5rem;border-radius:12px;text-align:center;margin-bottom:1.5rem}
    .accepted-banner-title{font-family:var(--font-display);font-size:1.5rem;margin-bottom:.25rem}
    .accepted-banner-sub{font-size:.88rem;opacity:.95}

    .meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(255,255,255,.15)}
    .meta-item{font-size:.75rem;letter-spacing:.05em}
    .meta-item .val{font-family:var(--font-display);font-size:1.1rem;color:var(--champagne-lt);display:block;margin-bottom:2px}
    .meta-item .lbl{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}

    .loading,.error{text-align:center;padding:4rem 2rem;font-size:1rem;color:var(--charcoal)}
    .error{color:#E05252}

    .footer{text-align:center;padding:2rem 1rem 1rem;font-size:.78rem;color:rgba(44,62,80,.6)}
    .footer a{color:var(--champagne);text-decoration:none}

    @media (max-width:540px){
      .hero{padding:2rem 1.25rem}
      .container{padding:2rem 1rem 4rem}
      .panel{padding:1.25rem;border-radius:12px}
      .accept-panel{padding:1.75rem 1.25rem}
      .meta-grid{grid-template-columns:1fr;gap:.5rem;text-align:left}
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-logo">Lake <span>Salt</span></div>
  <div id="hero-content">
    <div class="hero-eyebrow">Your custom proposal</div>
    <h1 class="proposal-name" id="proposal-headline"><em>Loading…</em></h1>
    <div class="meta-grid" id="meta-grid" style="display:none"></div>
  </div>
</div>

<div class="container">
  <div id="proposal-body">
    <div class="loading">Loading your quote…</div>
  </div>
  <div class="footer">
    <p>Questions? Reply to the email this came from or text <strong>Kendell at (385) 743-7771</strong>.</p>
    <p style="margin-top:.5rem">Lake Salt Bartending · Salt Lake City · <a href="https://lakesalt.us">lakesalt.us</a></p>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(async function() {
  const params = new URLSearchParams(location.search);
  const quoteId = params.get('id');
  const body = document.getElementById('proposal-body');
  const headline = document.getElementById('proposal-headline');
  const meta = document.getElementById('meta-grid');

  if (!quoteId) {
    body.innerHTML = '<div class="error">No quote ID — this link is broken. Please contact Kendell.</div>';
    return;
  }

  /* Init Firebase */
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  /* Load quote */
  let quote;
  try {
    const doc = await db.collection('quotes').doc(quoteId).get();
    if (!doc.exists) {
      body.innerHTML = '<div class="error">This quote was not found. The link may have expired or been removed.</div>';
      return;
    }
    quote = { id: doc.id, ...doc.data() };
  } catch (e) {
    console.error(e);
    body.innerHTML = '<div class="error">Could not load your quote. Please contact Kendell directly.</div>';
    return;
  }

  /* Headline */
  const name = quote.leadName || 'Your event';
  const words = name.split(' ');
  const last = words.length > 1 ? words.pop() : '';
  headline.innerHTML = last
    ? `${words.join(' ')} <em>${last}</em>`
    : `<em>${name}</em>`;

  /* Meta strip in hero */
  const li = quote.lineItems || {};
  meta.innerHTML = `
    ${li.serviceHours ? `<div class="meta-item"><span class="val">${li.serviceHours} hrs</span><span class="lbl">Service</span></div>` : ''}
    ${li.bartenders ? `<div class="meta-item"><span class="val">${li.bartenders}</span><span class="lbl">Bartenders</span></div>` : ''}
    ${li.guestCount ? `<div class="meta-item"><span class="val">${li.guestCount}</span><span class="lbl">Guests</span></div>` : ''}
  `;
  meta.style.display = '';

  /* Money formatter */
  const m = n => '$' + (Number(n)||0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  /* Build breakdown */
  const bartenderTotal = (li.serviceHours||0) * (li.bartenderRate||0) * (li.bartenders||0);
  const offMenuTotal = li.offMenuEnabled ? (li.offMenuQty||0) * (li.offMenuPrice||0) : 0;
  const customLines = Array.isArray(li.custom) ? li.custom.filter(l => (l.label||'').trim() || (l.price||0) > 0) : [];

  const acceptedAlready = !!quote.clientAcceptedAt;
  const acceptedBanner = acceptedAlready ? `
    <div class="accepted-banner">
      <div class="accepted-banner-title">✓ Quote accepted</div>
      <div class="accepted-banner-sub">Accepted by ${quote.clientAcceptedSignature || 'client'}. We'll be in touch with next steps.</div>
    </div>` : '';

  body.innerHTML = `
    ${acceptedBanner}
    <p class="intro">Hi ${(quote.leadName||'there').split(' ')[0]} — thanks for considering Lake Salt for your event. Here's a tailored quote with everything we'd take care of. Have questions before locking it in? Just reply to the email this came from.</p>

    <div class="panel">
      <div class="panel-label">What's included</div>
      <div class="line">
        <div>
          <div class="line-label">Bartender service</div>
          <div class="line-sub">${li.bartenders||1} bartender${(li.bartenders||1)===1?'':'s'} × ${li.serviceHours||0} hrs @ ${m(li.bartenderRate)}/hr</div>
        </div>
        <div class="line-amt">${m(bartenderTotal)}</div>
      </div>
      <div class="line">
        <div>
          <div class="line-label">Custom drink menu</div>
          <div class="line-sub">Curated cocktail + mocktail menu, designed for your event</div>
        </div>
        <div class="line-amt">${m(li.customMenuFee || 0)}</div>
      </div>
      ${li.offMenuEnabled && offMenuTotal > 0 ? `
      <div class="line">
        <div>
          <div class="line-label">Off-menu requests</div>
          <div class="line-sub">Up to ~${li.offMenuQty} additional drinks at ${m(li.offMenuPrice)}/each</div>
        </div>
        <div class="line-amt">${m(offMenuTotal)}</div>
      </div>` : ''}
      <div class="line">
        <div><div class="line-label">Travel & setup</div></div>
        <div class="line-amt">${m(li.travelFee || 0)}</div>
      </div>
      ${customLines.map(cl => `
        <div class="line">
          <div><div class="line-label">${escapeHTML(cl.label || 'Add-on')}</div></div>
          <div class="line-amt">${m(cl.price)}</div>
        </div>`).join('')}
    </div>

    <div class="panel totals">
      <div class="panel-label">Pricing</div>
      <div class="line"><div class="line-label">Subtotal</div><div class="line-amt">${m(quote.subtotal)}</div></div>
      ${quote.peakApplied ? `<div class="line"><div class="line-label">Peak season adjustment</div><div class="line-amt">+${m(quote.peakAdj)}</div></div>` : ''}
      ${quote.discountAmt > 0 ? `<div class="line"><div class="line-label">Discount</div><div class="line-amt" style="color:#22c55e">−${m(quote.discountAmt)}</div></div>` : ''}
      <div class="grand line">
        <div class="line-label">Total</div>
        <div class="line-amt">${m(quote.total)}</div>
      </div>
      <div class="deposit">A ${quote.depositPct || 30}% deposit (${m(quote.deposit)}) secures your date once you accept. The remainder is due the week of the event.</div>
    </div>

    ${quote.notes ? `<div class="panel"><div class="panel-label">Notes</div><div style="font-size:.95rem;color:var(--charcoal);line-height:1.7">${escapeHTML(quote.notes)}</div></div>` : ''}

    ${acceptedAlready ? '' : `
    <div class="accept-panel" id="accept-panel">
      <h2>Lock in <em>your date</em></h2>
      <p>Type your full name below to accept this quote. We'll follow up with the deposit invoice and a date-hold confirmation.</p>
      <form class="accept-form" id="accept-form">
        <input type="text" id="signature" placeholder="Your full name" required autocomplete="name" />
        <br>
        <button type="submit" class="accept-btn" id="accept-btn">✓ Accept this quote</button>
      </form>
      <div class="accept-fineprint">
        By accepting, you agree to a 30% deposit invoice and the quote terms above. Quote valid through ${quote.expiresAt || '14 days from issue'}.
      </div>
    </div>`}
  `;

  /* Track view (best-effort, fire and forget) */
  if (!acceptedAlready) {
    try {
      const views = Array.isArray(quote.clientViewedAt) ? [...quote.clientViewedAt] : [];
      views.push(new Date().toISOString());
      await db.collection('quotes').doc(quoteId).update({ clientViewedAt: views });
    } catch (e) { /* not critical */ }
  }

  /* Accept flow */
  const form = document.getElementById('accept-form');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const sig = document.getElementById('signature').value.trim();
      if (sig.length < 3) { alert('Please type your full name to accept.'); return; }
      const btn = document.getElementById('accept-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      try {
        await db.collection('quotes').doc(quoteId).update({
          clientAcceptedAt: firebase.firestore.FieldValue.serverTimestamp(),
          clientAcceptedSignature: sig,
          status: 'accepted'
        });
        document.getElementById('accept-panel').outerHTML = `
          <div class="accepted-banner" style="margin-top:1.5rem">
            <div class="accepted-banner-title">✓ Quote accepted — thank you!</div>
            <div class="accepted-banner-sub">Kendell will follow up shortly with the deposit invoice and a date-hold confirmation. You'll get a copy of this in your email.</div>
          </div>`;
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = '✓ Accept this quote';
        alert('Something went wrong. Please contact Kendell directly to confirm — he\'ll lock it in manually.');
      }
    });
  }

  function escapeHTML(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>

</body>
</html>
