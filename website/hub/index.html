<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub — Kendell</title>
  <link rel="manifest" href="/hub/manifest.webmanifest" />
  <meta name="theme-color" content="#1A1412" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hub" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #1A1412; --card: #1E1613; --bd: rgba(255,245,235,0.10);
      --gold: #C9A84C; --text: #F2EAE2; --muted: #9A8A7F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px;
    }
    .wrap { width: 100%; max-width: 760px; }
    header { text-align: center; margin-bottom: 40px; }
    .logo { font-size: 28px; font-weight: 800; letter-spacing: 0.01em; }
    .logo span { color: var(--gold); }
    .tagline { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
    .tile {
      background: var(--card); border: 1px solid var(--bd); border-radius: 16px;
      padding: 28px 24px; text-decoration: none; color: var(--text);
      display: flex; flex-direction: column; gap: 10px; min-height: 150px;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .tile:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
    .tile-icon { font-size: 34px; }
    .tile-title { font-size: 19px; font-weight: 700; }
    .tile-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .tile-go { margin-top: auto; font-size: 13px; font-weight: 600; color: var(--gold); }
    .tile.soon { opacity: 0.5; pointer-events: none; }
    .tile.soon .tile-go { color: var(--muted); }
    footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Kendell<span>OS</span></div>
      <div class="tagline">One place. All your dashboards.</div>
    </header>

    <div class="grid">
      <a class="tile" href="/admin/">
        <div class="tile-icon">🧂</div>
        <div class="tile-title">Lake Salt Admin</div>
        <div class="tile-sub">CRM, events, finance, quotes, and the dashboard cockpit.</div>
        <div class="tile-go">Open →</div>
      </a>

      <a class="tile" href="https://our-finances-93a54.firebaseapp.com/">
        <div class="tile-icon">📊</div>
        <div class="tile-title">Life OS</div>
        <div class="tile-sub">Personal finances and life dashboard.</div>
        <div class="tile-go">Open →</div>
      </a>

      <div class="tile soon">
        <div class="tile-icon">➕</div>
        <div class="tile-title">More coming</div>
        <div class="tile-sub">Future dashboards drop in here.</div>
        <div class="tile-go">Soon</div>
      </div>
    </div>

    <footer>Installed as an app · each dashboard stays independent</footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/hub/service-worker.js', { scope: '/hub/' })
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
